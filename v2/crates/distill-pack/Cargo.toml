[package]
name = "distill-pack"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
memmap2 = "0.7"
zstd.workspace = true
unicode-normalization.workspace = true
distill-core = { path = "../distill-core" }
distill-loader = { path = "../distill-loader", default-features = false }
distill-protocol = { path = "../distill-protocol" }
distill-wire = { path = "../distill-wire" }

[dev-dependencies]
distill-asset = { path = "../distill-asset" }
# The layer-stack tests put a daemon layer (`RpcIo`) above packs.
distill-loader = { path = "../distill-loader", features = ["rpc"] }
ngp-schema = { path = "../../../../newgameplus/ngp-schema" }
tempfile = "3"
