[package]
name = "distill-wire"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
distill-core = { path = "../distill-core" }
# The schema model is SHARED code (§5, §19): it lives in the engine
# workspace so source-walk, the engine, and distill agree byte-for-byte.
# Its canonical structural blob path encoding (§6, `encode_path`) is the
# bundles' too: the §12 artifact blob table sorts by the same encoded path
# bytes — one encoder, never two.
ngp-schema = { path = "../../../../newgameplus/ngp-schema", default-features = false }
# The value encoding (GAP 23 §17.3): an artifact image's dynamic slots hold it,
# and map keys and set elements sort by it.
ngp-value = { path = "../../../../newgameplus/ngp-value" }

[dev-dependencies]
# Tests read values and schemas as text.
ngp-schema = { path = "../../../../newgameplus/ngp-schema" }
