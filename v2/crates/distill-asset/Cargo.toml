[package]
name = "distill-asset"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = { workspace = true }
unicode-normalization = "0.1"
distill-core = { path = "../distill-core" }
# The §12 generated-table vocabulary (CtorTable/DropTable/SkipWriterTable,
# NativeLayoutNode, CallbackPanic, Blob) is declared once in distill-wire
# and REUSED here — one declaration, never two.
distill-wire = { path = "../distill-wire" }
# The typed value model (`to_value`, default writers) is the shared schema
# crate's.
ngp-schema = { path = "../../../../newgameplus/ngp-schema" }
distill-asset-macro = { path = "../distill-asset-macro" }
