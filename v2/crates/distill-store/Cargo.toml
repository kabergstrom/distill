[package]
name = "distill-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tracing.workspace = true
distill-core = { path = "../distill-core" }
distill-schema = { path = "../distill-schema" }
distill-wire = { path = "../distill-wire" }
ngp-schema = { path = "../../../../newgameplus/ngp-schema" }
blake3 = { workspace = true }
# Bundled SQLite: compiled from source, no system dependency (§13's
# metadata layer must not vary by host library version).
rusqlite = { version = "0.32", features = ["bundled"] }
getrandom = "0.2"
unicode-normalization.workspace = true

[features]
# Test instruments and setup writers: statement tracing and query plans for
# tests that check how the store is read (`StoreReader::trace_statements`,
# `StoreReader::query_plan_details`, `pages_fetched`), whole-table reads the
# bounded reads are compared against, and row writers and CAS evictions
# tests set state up with.
test-hooks = ["rusqlite/trace"]

[dev-dependencies]
tempfile = "3"
# The integration tests use the test hooks.
distill-store = { path = ".", features = ["test-hooks"] }
blake3 = { workspace = true }
# `trace` lets the query-plan tests capture the statements readers issue.
rusqlite = { version = "0.32", features = ["bundled", "trace"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
