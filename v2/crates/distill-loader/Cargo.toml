[package]
name = "distill-loader"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
distill-asset = { path = "../distill-asset" }
distill-build = { path = "../distill-build" }
distill-core = { path = "../distill-core" }
distill-rpc = { path = "../distill-rpc" }
distill-schema = { path = "../distill-schema" }
distill-store = { path = "../distill-store" }
distill-wire = { path = "../distill-wire" }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
capnp = "0.26.2"
capnp-futures = "0.26.1"
futures = "0.3"
libc = "0.2"
tokio-util = { version = "0.7", features = ["compat"] }
distill-test-project = { path = "../distill-daemon/tests/fixtures/test-project" }
distill-rpc = { path = "../distill-rpc", features = ["test-hooks"] }
