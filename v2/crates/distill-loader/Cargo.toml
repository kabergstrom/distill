[package]
name = "distill-loader"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
distill-asset = { path = "../distill-asset" }
distill-core = { path = "../distill-core" }
distill-protocol = { path = "../distill-protocol" }
distill-client = { path = "../distill-client", optional = true }
distill-wire = { path = "../distill-wire" }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"], optional = true }

[features]
default = ["rpc"]
# The daemon connection (`RpcIo`, authoring calls); off, packs only.
rpc = ["dep:distill-client", "dep:tokio"]

[dev-dependencies]
# The RPC tests run a daemon-side server on a store.
distill-store = { path = "../distill-store" }
capnp = "0.26.2"
capnp-futures = "0.26.1"
futures = "0.3"
libc = "0.2"
tokio-util = { version = "0.7", features = ["compat"] }
distill-test-project = { path = "../distill-daemon/tests/fixtures/test-project" }
distill-rpc = { path = "../distill-rpc", features = ["test-hooks"] }
