[package]
name = "distill-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "distilld"
path = "src/bin/distill-daemon.rs"

[dependencies]
# A schema type's canonical text for its tag epoch (`build::type_tag_epochs`).
serde_json = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
blake3 = { workspace = true }
distill-asset = { path = "../distill-asset" }
distill-bundle = { path = "../distill-bundle" }
distill-build = { path = "../distill-build" }
distill-core = { path = "../distill-core" }
distill-json = { path = "../distill-json" }
distill-migrate = { path = "../distill-migrate" }
distill-pipeline-api = { path = "../distill-pipeline-api" }
distill-pack = { path = "../distill-pack" }
distill-rpc = { path = "../distill-rpc" }
distill-schema = { path = "../distill-schema" }
distill-store = { path = "../distill-store" }
distill-wire = { path = "../distill-wire" }
globset = { workspace = true }
# Fresh import identities: one random seed per import run.
getrandom = "0.2"
notify = { workspace = true }
ngp-module-host = { path = "../../../../newgameplus/ngp-module-host" }
rayon = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
unicode-normalization = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
# Test drivers and instruments: the coordinator's single-step reconcile
# drivers, `watched_imports_needing_reimport`, `ScanSnapshot::file_rows`, and
# `ModuleHost::publish_candidate` with its epoch's token and failure report.
test-hooks = []

[dev-dependencies]
# The integration tests use the test hooks.
distill-daemon = { path = ".", features = ["test-hooks"] }
distill-test-project = { path = "tests/fixtures/test-project" }
distill-pipeline-fixture = { path = "tests/fixtures/pipeline-module" }
rusqlite = { version = "0.32", features = ["bundled"] }
bincode = "1.3.1"
distill-asset-macro = { path = "../distill-asset-macro" }
distill-loader = { path = "../distill-loader" }
newgameplus-assets = { path = "../../../../newgameplus/newgameplus-assets" }
rafx-api = { path = "../../../../rafx/rafx-api", features = ["serde-support"] }
tempfile = "3"
distill-store = { path = "../distill-store", features = ["test-hooks"] }
