[workspace]
resolver = "2"
members = [
    "crates/distill-asset",
    "crates/distill-bundle",
    "crates/distill-build",
    "crates/distill-client",
    "crates/distill-core",
    "crates/distill-daemon",
    "crates/distill-daemon/tests/fixtures/pipeline-module",
    "crates/distill-daemon/tests/fixtures/game-assets-pipeline",
    "crates/distill-daemon/tests/fixtures/test-project",
    "crates/distill-json",
    "crates/distill-loader",
    "crates/distill-pack",
    "crates/distill-pack-build",
    "crates/distill-pipeline-api",
    "crates/distill-protocol",
    "crates/distill-rpc",
    "crates/distill-schema",
    "crates/distill-store",
    "crates/distill-test-assets",
    "crates/distill-wire",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
ryu = "1"
unicode-normalization = "0.1"
globset = "0.4"
notify = "8.2.0"
sha1_smol = "1"
proc-macro2 = "1"
quote = "1"
rayon = "1"
syn = "2"
trybuild = "1"
zstd = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# distilld as start-engine.sh builds it: optimized, with debug assertions on,
# because a pipeline module's ABI identity includes its cfg set and pipelines
# build in the dev profile (a release daemon rejects them).
[profile.daemon]
inherits = "release"
debug-assertions = true

# XXH3 (distill_core::hash) runs on every scan, import, artifact check and
# fetched payload. It is pure Rust, slow unoptimized (rpc_io_backpressure's
# 4 MiB fetch went past its frame budget); blake3's SIMD was C/assembly
# that cc built optimized in every profile.
[profile.dev.package.xxhash-rust]
opt-level = 3

# The value encoding (GAP 23 §17.3): its recursive walks decode up to 256
# nested frames; unoptimized frames (~6 KiB a level) would not fit a 2 MiB
# thread stack at the cap.
[profile.dev.package.ngp-value]
opt-level = 2
